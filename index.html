<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משחקים ולמידה לילדים</title>
<link rel="icon" href="/shapeland/icons/orkeepers.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,#141a4a,#3d2b7d);color:#fff;font-family:"Varela Round","Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center}
  main{max-width:720px;width:100%;padding:28px 18px;text-align:center}
  h1{font-size:1.7em;margin:.2em 0}
  p.sub{color:#cfd3ff;margin:0 0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  a.card{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:22px 16px;color:#fff;text-decoration:none;transition:transform .15s,background .15s}
  a.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.16)}
  a.card img,a.card .em{width:88px;height:88px;border-radius:20px;font-size:64px;line-height:88px}
  a.card b{font-size:1.25em}
  a.card small{color:#dfe2ff}
  footer{margin-top:28px;font-size:.85em;color:#aab0e0}
  footer a{color:#ffd166}
</style>
</head>
<body>
<main>
  <h1>משחקים ולמידה לילדים</h1>
  <p class="sub">חינמיים לגמרי · בלי פרסומות · בלי רכישות</p>
  <div class="grid">
    <a class="card" href="/shapeland/"><img src="/shapeland/icons/orkeepers.svg" alt=""><b>OrKeepers · שומרי האור</b><small>עולם תלת־ממדי: בונים, מטיילים, ולומדים אנגלית, חשבון וכסף – יחד עם חברים</small></a>
    <a class="card" href="/hamore-hakolit/"><span class="em" aria-hidden="true">🦉</span><b>המורה הקולית</b><small>שברים וסדרות לכיתה ד', בקול ועם ציורים</small></a>
  </div>
  <footer><a href="/shapeland/privacy.html">מדיניות פרטיות · Privacy Policy</a></footer>
</main>
</body>
</html>
